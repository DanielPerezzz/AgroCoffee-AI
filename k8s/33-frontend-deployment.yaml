apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrocoffee-frontend
  namespace: agrocoffee
  labels:
    app.kubernetes.io/name: agrocoffee-frontend
    app.kubernetes.io/part-of: agrocoffee-ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agrocoffee-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agrocoffee-frontend
        app.kubernetes.io/part-of: agrocoffee-ai
    spec:
      containers:
        - name: web
          image: agrocoffee-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
