apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agrocoffee-backend
  namespace: agrocoffee
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agrocoffee-backend
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
