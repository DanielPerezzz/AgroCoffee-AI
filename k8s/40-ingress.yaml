apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrocoffee
  namespace: agrocoffee
  labels:
    app.kubernetes.io/name: agrocoffee
    app.kubernetes.io/part-of: agrocoffee-ai
spec:
  ingressClassName: nginx
  rules:
    - host: agrocoffee.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: agrocoffee-backend
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: agrocoffee-backend
                port:
                  number: 80
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: agrocoffee-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agrocoffee-frontend
                port:
                  number: 80
