apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrocoffee-backend
  namespace: agrocoffee
  labels:
    app.kubernetes.io/name: agrocoffee-backend
    app.kubernetes.io/part-of: agrocoffee-ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agrocoffee-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agrocoffee-backend
        app.kubernetes.io/part-of: agrocoffee-ai
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "Esperando PostgreSQL..."; sleep 3; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: agrocoffee-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agrocoffee-secrets
                  key: POSTGRES_USER
        - name: run-migrations
          image: agrocoffee-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: agrocoffee-config
            - secretRef:
                name: agrocoffee-secrets
      containers:
        - name: api
          image: agrocoffee-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrocoffee-config
            - secretRef:
                name: agrocoffee-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
